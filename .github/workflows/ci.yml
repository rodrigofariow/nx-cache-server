name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: this workflow only reads the repo. It uses no secrets —
# the tests run against an in-process mock, never real AWS — so a compromised
# step has nothing to exfiltrate and cannot write back to the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Update Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      # --locked fails if Cargo.lock would change, keeping CI reproducible and
      # blocking surprise dependency drift.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
